<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Preview</title>
<style>
  :root {
    --bg: #121316;
    --panel: #1a1c21;
    --line: #2a2d34;
    --text: #c8ccd4;
    --dim: #7d828d;
    --err: #ff8a80;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    outline: none;
    touch-action: none;
    cursor: crosshair;
  }
  /* #box is the area the frame may occupy; JS sizes #screen to fit it exactly (same result as object-fit: contain). */
  #box {
    position: absolute;
    inset: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screen {
    flex: none;
    display: none;
    object-fit: contain;
    border-radius: 18px;
    background: #000;
    /* box-shadow, not border: keeps the canvas content box equal to its border box for coordinate mapping. */
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 6px 24px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  #stage:focus-visible #screen { box-shadow: 0 0 0 2px var(--accent), 0 6px 24px rgba(0, 0, 0, 0.5); }
  #wait {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(18, 19, 22, 0.82);
    font-size: 16px;
    color: var(--text);
    text-align: center;
    pointer-events: none;
  }
  #wait small { font-size: 12px; color: var(--dim); }
  #wait.show { display: flex; }
  .dot {
    position: absolute;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: rgba(110, 168, 254, 0.25);
    pointer-events: none;
    animation: dot 0.45s ease-out forwards;
  }
  @keyframes dot { to { transform: scale(1.8); opacity: 0; } }

  #bar {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 6px 8px 4px;
    justify-content: center;
  }
  #bar button {
    flex: 1 1 0;
    max-width: 140px;
    padding: 7px 8px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    cursor: pointer;
  }
  #bar button:hover { border-color: #3d424c; background: #20232a; }
  #bar button:active { background: #2a2e37; }
  #hint {
    flex: none;
    padding: 0 8px 4px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
  }
  #status {
    flex: none;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 10px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #msg.err { color: var(--err); }
  #fps { flex: none; }
</style>
</head>
<body>
  <div id="stage" tabindex="0" aria-label="Android device screen">
    <div id="box"><canvas id="screen" width="1" height="1"></canvas></div>
    <div id="wait" role="status"><span>等待模拟器启动…</span><small id="waitSub"></small></div>
  </div>
  <div id="bar">
    <button type="button" data-key="4" title="Back (keyevent 4)">◁ Back</button>
    <button type="button" data-key="3" title="Home (keyevent 3)">○ Home</button>
    <button type="button" data-key="187" title="Recents (keyevent 187)">□ Recents</button>
  </div>
  <div id="hint">点击=触摸 · 拖动=滑动 · 滚轮=滚动 · 键盘=输入（仅 ASCII）</div>
  <div id="status"><span id="msg">连接中…</span><span id="fps">– fps</span></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), box = $('box'), canvas = $('screen');
  const ctx = canvas.getContext('2d', { alpha: false });   // opaque: ignore any alpha the device reports
  const wait = $('wait'), waitSub = $('waitSub'), msgEl = $('msg'), fpsEl = $('fps');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // ------------------------------------------------------------ status bar
  let frameErr = '', inputErr = '', info = '', inputErrTimer = 0;
  function renderMsg() {
    const text = inputErr || frameErr || info;
    msgEl.textContent = text;
    msgEl.classList.toggle('err', !!(inputErr || frameErr));
    msgEl.title = text;
  }
  function flashInputError(text) {
    inputErr = text;
    renderMsg();
    clearTimeout(inputErrTimer);
    inputErrTimer = setTimeout(() => { inputErr = ''; renderMsg(); }, 3000);
  }

  // ------------------------------------------------------------ fit canvas into #box (contain)
  // The canvas bitmap is device-sized (w x h); only its CSS size changes with the pane.
  let dimW = 0, dimH = 0;
  function fit(w = dimW, h = dimH) {
    if (!w || !h) return;
    dimW = w; dimH = h;
    const aw = box.clientWidth, ah = box.clientHeight;
    if (aw <= 0 || ah <= 0) return;
    const s = Math.min(aw / w, ah / h);
    canvas.style.width = Math.max(1, Math.floor(w * s)) + 'px';
    canvas.style.height = Math.max(1, Math.floor(h * s)) + 'px';
  }
  new ResizeObserver(() => fit()).observe(box);

  function setSize(w, h) {
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }   // resizing clears the bitmap
    canvas.style.display = 'block';
    fit(w, h);
  }

  // ------------------------------------------------------------ frame loop
  let frames = 0, fpsStart = performance.now();
  function tickFps() {
    frames++;
    const now = performance.now();
    if (now - fpsStart >= 1000) {
      fpsEl.textContent = (frames * 1000 / (now - fpsStart)).toFixed(1) + ' fps';
      frames = 0; fpsStart = now;
    }
  }
  async function failText(r) {
    return (await r.text()).trim().slice(0, 200) || 'HTTP ' + r.status;
  }

  // Preferred path: raw RGBA from /raw, no PNG encode/decode.
  async function drawRaw() {
    const r = await fetch('/raw?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(await failText(r));
    const w = Number(r.headers.get('X-Width')), h = Number(r.headers.get('X-Height'));
    const buf = await r.arrayBuffer();
    if (!(w > 0 && h > 0) || buf.byteLength !== w * h * 4) throw new Error('bad raw frame');
    setSize(w, h);
    ctx.putImageData(new ImageData(new Uint8ClampedArray(buf), w, h), 0, 0);
  }
  // Fallback path: PNG from /frame.
  async function drawPng() {
    const r = await fetch('/frame?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(await failText(r));
    const bmp = await createImageBitmap(await r.blob());
    try {
      setSize(bmp.width, bmp.height);
      ctx.drawImage(bmp, 0, 0);
    } finally {
      bmp.close();
    }
  }

  let mode = 'raw', rawFails = 0, nextRawProbe = 0;
  const RAW_RETRY_MS = 15000;
  async function nextFrame() {
    if (mode === 'png' && performance.now() >= nextRawProbe) {       // quiet periodic probe back to raw
      try { await drawRaw(); mode = 'raw'; rawFails = 0; return; }
      catch (_) { nextRawProbe = performance.now() + RAW_RETRY_MS; }
    }
    if (mode === 'raw') {
      try { await drawRaw(); rawFails = 0; }
      catch (e) {
        if (++rawFails >= 3) { mode = 'png'; nextRawProbe = performance.now() + RAW_RETRY_MS; }   // 3 strikes: use PNG
        throw e;
      }
    } else {
      await drawPng();
    }
  }

  async function frameLoop() {
    for (;;) {
      try {
        await nextFrame();
        if (frameErr) frameErr = '';
        info = dimW + '×' + dimH + ' · ' + mode;
        renderMsg();
        tickFps();
      } catch (e) {
        frameErr = String(e && e.message || e);
        renderMsg();
        fpsEl.textContent = '– fps';
        frames = 0; fpsStart = performance.now();
        await sleep(1000);
      }
    }
  }

  // ------------------------------------------------------------ device status polling
  let hasDevice = false;
  async function pollStatus() {
    for (;;) {
      try {
        const s = await (await fetch('/status', { cache: 'no-store' })).json();
        hasDevice = Array.isArray(s.devices) && s.devices.length > 0;
        wait.classList.toggle('show', !hasDevice);
        waitSub.textContent = hasDevice ? '' : (s.adb ? '' : '未找到 adb（Android SDK 尚未安装？）');
      } catch (e) {
        hasDevice = false;
        wait.classList.add('show');
        waitSub.textContent = '无法连接预览服务';
      }
      await sleep(hasDevice ? 5000 : 2000);
    }
  }

  // ------------------------------------------------------------ input transport
  function post(body) {
    return fetch('/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(async (r) => {
      if (r.ok) return;
      let msg = 'HTTP ' + r.status;
      try { msg = (await r.json()).error || msg; } catch (_) {}
      flashInputError('input: ' + msg);
    }).catch((e) => flashInputError('input: ' + (e && e.message || e)));
  }
  // Keys and text must reach the device in order, so they share one serial queue.
  let keyQueue = Promise.resolve();
  const queued = (body) => { keyQueue = keyQueue.then(() => post(body)); };

  // ------------------------------------------------------------ coordinate mapping
  // Maps client coordinates to device pixels via the canvas content box, honouring contain letterboxing.
  // Returns null outside the picture unless `clampToFrame` is set.
  function toDevice(cx, cy, clampToFrame) {
    const nw = canvas.width, nh = canvas.height;
    const r = canvas.getBoundingClientRect();
    if (!dimW || !r.width || !r.height) return null;           // nothing drawn yet
    const scale = Math.min(r.width / nw, r.height / nh);    // css px per device px
    const left = r.left + (r.width - nw * scale) / 2;
    const top = r.top + (r.height - nh * scale) / 2;
    let x = (cx - left) / scale, y = (cy - top) / scale;
    if (x < 0 || y < 0 || x >= nw || y >= nh) {
      if (!clampToFrame) return null;
      x = clamp(x, 0, nw - 1); y = clamp(y, 0, nh - 1);
    }
    return { x: Math.floor(x), y: Math.floor(y), scale };
  }

  // ------------------------------------------------------------ pointer: tap / long-press / swipe
  const MOVE_SLOP_CSS = 8;   // css px of travel still counted as "not moved"
  const LONG_MS = 500;
  let down = null;

  function ripple(cx, cy) {
    const r = stage.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = (cx - r.left) + 'px';
    d.style.top = (cy - r.top) + 'px';
    stage.appendChild(d);
    setTimeout(() => d.remove(), 500);
  }

  stage.addEventListener('pointerdown', (e) => {
    stage.focus({ preventScroll: true });
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (down) return;
    const p = toDevice(e.clientX, e.clientY, false);
    if (!p) return;                                 // letterbox area: ignore
    down = { id: e.pointerId, x0: p.x, y0: p.y, t0: performance.now(), cx: e.clientX, cy: e.clientY };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });

  stage.addEventListener('pointerup', (e) => {
    if (!down || e.pointerId !== down.id) return;
    const g = down; down = null;
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
    const p = toDevice(e.clientX, e.clientY, true) || { x: g.x0, y: g.y0, scale: 1 };
    const held = performance.now() - g.t0;
    const distCss = Math.hypot(e.clientX - g.cx, e.clientY - g.cy);
    ripple(g.cx, g.cy);
    if (distCss < MOVE_SLOP_CSS) {
      if (held < LONG_MS) post({ type: 'tap', x: g.x0, y: g.y0 });
      else post({ type: 'swipe', x1: g.x0, y1: g.y0, x2: g.x0, y2: g.y0, ms: 600 });
    } else {
      post({ type: 'swipe', x1: g.x0, y1: g.y0, x2: p.x, y2: p.y, ms: Math.round(clamp(held, 100, 1000)) });
    }
  });

  stage.addEventListener('pointercancel', (e) => {
    if (down && e.pointerId === down.id) down = null;
  });
  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  // ------------------------------------------------------------ wheel -> vertical swipe, throttled
  let lastWheel = 0;
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!e.deltaY) return;
    const now = performance.now();
    if (now - lastWheel < 250) return;
    const nw = canvas.width, nh = canvas.height;
    if (!dimW) return;
    lastWheel = now;
    const x = Math.floor(nw / 2);
    const from = Math.floor(nh * (e.deltaY > 0 ? 0.65 : 0.35));
    const to = Math.floor(nh * (e.deltaY > 0 ? 0.35 : 0.65));
    post({ type: 'swipe', x1: x, y1: from, x2: x, y2: to, ms: 250 });
  }, { passive: false });

  // ------------------------------------------------------------ keyboard
  let textBuf = '', textTimer = 0;
  function flushText() {
    clearTimeout(textTimer);
    textTimer = 0;
    while (textBuf.length) {
      queued({ type: 'text', text: textBuf.slice(0, 200) });
      textBuf = textBuf.slice(200);
    }
  }
  const SPECIAL_KEYS = { Backspace: 67, Enter: 66, Escape: 4 };

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;   // leave browser shortcuts alone
    if (e.key.length === 1 && e.key >= ' ' && e.key <= '~') {
      textBuf += e.key;
      if (!textTimer) textTimer = setTimeout(flushText, 150);
      e.preventDefault();
    } else if (Object.prototype.hasOwnProperty.call(SPECIAL_KEYS, e.key)) {
      flushText();                                                    // keep typing order
      queued({ type: 'key', code: SPECIAL_KEYS[e.key] });
      e.preventDefault();
    }
  });

  // ------------------------------------------------------------ toolbar
  for (const b of document.querySelectorAll('#bar button')) {
    b.addEventListener('mousedown', (e) => e.preventDefault());       // don't steal keyboard focus
    b.addEventListener('click', () => post({ type: 'key', code: Number(b.dataset.key) }));
  }

  frameLoop();
  pollStatus();
})();
</script>
</body>
</html>
